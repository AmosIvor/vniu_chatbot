version: "3.1"

nlu:
  - intent: product_search
    examples: |
      - How do I search for a specific product?
      - Can you help me find a particular item?
      - Where's the search bar?
      - I'm looking for a specific piece of clothing
      - How can I search for products on your website?
      - Is there a way to filter search results?
      - Show me how to search for items

  - intent: product_information
    examples: |
      - Can you tell me more about this product?
      - What are the features of this item?
      - I need more details about this clothing
      - What materials is this made from?
      - Does this come in different colors?
      - What sizes are available for this product?
      - Can you describe this item to me?

  - intent: product_availability
    examples: |
      - Is this item in stock?
      - Do you have this product available?
      - When will this be back in stock?
      - Can I get this in my size?
      - Are there any left of this item?
      - Check stock for this product
      - Is this sold out?

  - intent: product_price
    examples: |
      - How much does this cost?
      - What's the price of this item?
      - Can you tell me the price?
      - Is there a discount on this product?
      - Are there any ongoing sales?
      - How much do I need to pay for this?
      - What's the current price for this product?

  - intent: product_comparison
    examples: |
      - What's the difference between these two products?
      - Can you compare these items for me?
      - How does this compare to a similar product?
      - Which one is better?
      - What are the pros and cons of each?
      - Help me choose between these options
      - Can you show me a side-by-side comparison?

  - intent: product_recommendations
    examples: |
      - What do you recommend?
      - Can you suggest some products for me?
      - What's popular right now?
      - I need help finding something to wear
      - What goes well with this item?
      - Show me some outfit ideas
      - What are your best-selling items?

  - intent: product_search_with_category_and_colour
    examples: |
      - I want to find some [blue](colour) [tall](category)
      - Show me [red](colour) [polo](category)
      - Do you have any [black](colour) [cloth](category)?
      - I need a [white](colour) [t-shirt](category)
      - Find me a [green](colour) [shoe](category)
      - Are there any [yellow](colour) [jeans](category)?
      - I am looking for a [pink](colour) [baggy](category)
      - Can you show me [brown](colour) [glass](category)?
      - Do you have [grey](colour) [hoodie](category)?
      - Find me [purple](colour) [vest](category)
      - I want to find some [shirt](category) that have [blue](colour)
      - Do you have any [shorts](category) with [black](colour)?
      - Show me [tall](category) in [white](colour)
      - I need a [cloth](category) that is [green](colour)
      - Are there any [polo](category) in [yellow](colour)?
      - Find me [t-shirt](category) with [brown](colour)

  - intent: product_search_with_image_and_colour
    examples: |
      - Find me something similar to this image, but in [blue](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - I like this style, do you have it in [red](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - Show me a product similar to this, but I want it in [black](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - Do you have anything like this in [white](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - I want to buy something that looks like this but in [green](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - Can you find me a product similar to this in [yellow](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - I like this design, but I need it in [pink](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - Do you have this in [brown](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - I want a similar style as this, but in [grey](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - This is nice! Can you show me a [purple](colour) one? ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - Show me something like this but in [blue](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - I need a similar product to this, but in [red](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - Do you have a version of this in [black](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - Find me something like this, but I prefer [white](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)
      - This is close, but I want it in [green](colour) ; [https://m.media-amazon.com/images/I/91V12ufIXRL._AC_UY1100_.jpg](image_product)

  - lookup: category
    examples: |
      - tall
      - polo
      - cloth
      - t-shirt
      - shorts
      - shoe
      - shirt
      - jeans
      - baggy
      - glass
      - hoodie
      - vest

  - lookup: colour
    examples: |
      - blue
      - red
      - black
      - white
      - green
      - yellow
      - pink
      - brown
      - grey
      - purple
